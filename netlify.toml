# Netlify configuration for the Next.js 16 portfolio (static export)

[build]
  command = "npm run build"
  publish = "out"

# every page: security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# hashed build files never change: cache them for a year
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/work/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# plain-text guides for AI answer engines
[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# the old resume (it contains a phone number): keep it out of search results
[[headers]]
  for = "/ARUNODOY.pdf"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
